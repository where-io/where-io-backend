services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: whereio_db

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/whereio_db
      GOOGLE_MAP_API_KEY: ${GOOGLE_API_KEY}
    depends_on:
      - mongodb

volumes:
  mongo_data:
